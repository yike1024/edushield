# =============================================================================
# EduShield Web - Nginx 反向代理配置
# 适用场景：多用户共享一台 VPS，每个用户在浏览器自行输入 API Key
# 服务器侧不保存任何用户的 API Key
# =============================================================================

# 后端 DeepSeek API 上游：用变量便于将来切换 / 灰度
upstream deepseek_api_upstream {
    server api.deepseek.com:443;
    keepalive 32;
}

# AiSOC 各部件上游（大脑 + 四域安全部件）
upstream aisoc_brain_upstream      { server 127.0.0.1:6657; keepalive 32; }
upstream aisoc_pentest_upstream    { server 127.0.0.1:8787; keepalive 32; }
upstream aisoc_logaudit_upstream   { server 127.0.0.1:8788; keepalive 32; }
upstream aisoc_threatintel_upstream{ server 127.0.0.1:8789; keepalive 32; }
upstream aisoc_incident_upstream   { server 127.0.0.1:8790; keepalive 32; }

# 通用宏：AiSOC 某部件反代（SSE 流 + 长超时）
# 使用 include 模式；这里内嵌到每个 location 中以便阅读

server {
    listen 80;
    server_name _;

    # 1) 静态前端托管
    # 把 desktop/frontend/dist/ 目录里的构建产物复制到 /var/www/reasonix/
    root /var/www/reasonix;
    index index.html;

    # 上传/请求体大小（多轮对话 history 可能较大）
    client_max_body_size 10m;

    # 2) DeepSeek API 反向代理（关键：解决浏览器 CORS）
    # 浏览器请求 /deepseek-api/v1/chat/completions
    #   → Nginx 转发到 https://api.deepseek.com/v1/chat/completions
    # 浏览器看到的是同源请求，不会触发 CORS preflight
    location /deepseek-api/ {
        # 关键：把路径前缀 /deepseek-api/ 替换为 /
        rewrite ^/deepseek-api/(.*)$ /$1 break;

        proxy_pass https://deepseek_api_upstream;
        proxy_http_version 1.1;

        # SNI / Host 必须是 api.deepseek.com，否则 TLS 握手失败
        proxy_set_header Host api.deepseek.com;
        proxy_ssl_server_name on;
        proxy_ssl_name api.deepseek.com;

        # 透传用户浏览器里的 Authorization 头（包含用户自己的 API Key）
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Accept $http_accept;

        # 关闭 Nginx 自身的缓冲，保证 SSE 流式响应（打字机）实时回传
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        # 推理模型最长可能 5-10 分钟，给足超时
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # 透传 SSE 必要的响应头
        proxy_pass_header Content-Type;
        proxy_pass_header Cache-Control;
        proxy_pass_header Connection;
    }

    # --------------------------------------------------------------
    # 2.5) AiSOC 安全运营大脑 API 反向代理（5 个部件 + SSE 流）
    # 前端 aisoc-api.ts 默认使用 /aisoc-brain/api，由 Nginx 去除前缀后转发
    # --------------------------------------------------------------
    location /aisoc-brain/ {
        rewrite ^/aisoc-brain/(.*)$ /$1 break;
        proxy_pass http://aisoc_brain_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass_header Content-Type;
        proxy_pass_header Cache-Control;
        proxy_pass_header Connection;
    }

    location /aisoc-pentest/ {
        rewrite ^/aisoc-pentest/(.*)$ /$1 break;
        proxy_pass http://aisoc_pentest_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass_header Content-Type;
        proxy_pass_header Cache-Control;
        proxy_pass_header Connection;
    }

    location /aisoc-logaudit/ {
        rewrite ^/aisoc-logaudit/(.*)$ /$1 break;
        proxy_pass http://aisoc_logaudit_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass_header Content-Type;
        proxy_pass_header Cache-Control;
        proxy_pass_header Connection;
    }

    location /aisoc-threatintel/ {
        rewrite ^/aisoc-threatintel/(.*)$ /$1 break;
        proxy_pass http://aisoc_threatintel_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass_header Content-Type;
        proxy_pass_header Cache-Control;
        proxy_pass_header Connection;
    }

    location /aisoc-incident/ {
        rewrite ^/aisoc-incident/(.*)$ /$1 break;
        proxy_pass http://aisoc_incident_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass_header Content-Type;
        proxy_pass_header Cache-Control;
        proxy_pass_header Connection;
    }

    # 3) SPA fallback：所有未匹配的路径回退到 index.html（React Router 等需要）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 4) 静态资源缓存策略（带 hash 的资源可永久缓存）
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 5) 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 关闭服务器版本号暴露
    server_tokens off;
}
